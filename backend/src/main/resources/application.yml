server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: usuarios-api
  datasource:
    url: jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Orígenes permitidos para el frontend (separados por coma).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    # Carga usuarios de ejemplo al iniciar (la base H2 es en memoria).
    enabled: ${APP_SEED_ENABLED:true}
